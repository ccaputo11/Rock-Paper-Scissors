
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section class="intro">
      <h1>Rock, Paper, Scissors</h1>
      <p>Ready to challenge the computer?</p>
      <button class="intro-button">Let's Play!</button>
    </section>

    <section class="match fadeOut">
      <div class="score">
        <div class="player-score">
          <h2>Player</h2>
          <p>0</p>
        </div>
        <div class="computer-score">
          <h2>Computer</h2>
          <p>0</p>
        </div>
      </div>

      <h2 class="winner">Choose your move!</h2>

      <div class="hands">
        <div class="player-hand">✊</div>
        <div class="computer-hand">✊</div>
      </div>

      <div class="options">
        <button>rock</button>
        <button>paper</button>
        <button>scissors</button>
      </div>
    </section>
  </main>
</body>
</html>
